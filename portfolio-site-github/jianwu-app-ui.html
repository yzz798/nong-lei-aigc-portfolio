<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>简物 JianWu — 极简电商 App UI 原型</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: #E8E8F0; min-height: 100vh; }
  input::placeholder { color: #8C8C9E; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @media (max-width: 720px) {
    .info-panel { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback } = React;

/* ─── Inline SVG Icon Components ─── */
function SvgWrap({ size = 24, color = "currentColor", strokeWidth = 1.5, fill = "none", children, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>
      {children}
    </svg>
  );
}

function IconSearch(p) { return <SvgWrap {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></SvgWrap>; }
function IconHome(p) { return <SvgWrap {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></SvgWrap>; }
function IconGrid(p) { return <SvgWrap {...p}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></SvgWrap>; }
function IconMessage(p) { return <SvgWrap {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></SvgWrap>; }
function IconCart(p) { return <SvgWrap {...p}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></SvgWrap>; }
function IconUser(p) { return <SvgWrap {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></SvgWrap>; }
function IconHeart(p) { return <SvgWrap {...p} fill={p.filled ? p.color : "none"}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></SvgWrap>; }
function IconShare(p) { return <SvgWrap {...p}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></SvgWrap>; }
function IconChevronLeft(p) { return <SvgWrap {...p}><polyline points="15 18 9 12 15 6"/></SvgWrap>; }
function IconPlus(p) { return <SvgWrap {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></SvgWrap>; }
function IconMinus(p) { return <SvgWrap {...p}><line x1="5" y1="12" x2="19" y2="12"/></SvgWrap>; }
function IconStar(p) { return <SvgWrap {...p} fill={p.fillColor || "#F39C12"} color={p.fillColor || "#F39C12"}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></SvgWrap>; }
function IconTruck(p) { return <SvgWrap {...p}><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></SvgWrap>; }
function IconShield(p) { return <SvgWrap {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></SvgWrap>; }
function IconClock(p) { return <SvgWrap {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></SvgWrap>; }
function IconArrowRight(p) { return <SvgWrap {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></SvgWrap>; }
function IconCamera(p) { return <SvgWrap {...p}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></SvgWrap>; }

/* ──────────────────────────────────────────────
   简物 (JianWu) — 极简电商 App UI 原型
   ────────────────────────────────────────────── */

const C = {
  primary: "#1A1A2E", primaryLight: "#3D3D5C", primaryContainer: "#E8E8F0",
  accent: "#E85D3A", accentLight: "#FFF0EC", accentDark: "#C44525",
  surface: "#FFFFFF", surfaceVariant: "#F7F7FA",
  onSurface: "#1A1A2E", onSurfaceVariant: "#8C8C9E",
  outline: "#E5E5EA", success: "#2ECC71", disabled: "#C7C7D1",
};

const categories = ["推荐", "新品", "数码", "家居", "服饰", "美食", "运动", "文创"];

const banners = [
  { title: "夏日焕新季", subtitle: "精选好物低至5折", bg: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)" },
  { title: "新品首发", subtitle: "设计师联名款上线", bg: "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)" },
  { title: "会员专享", subtitle: "满299减50", bg: "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)" },
];

const products = [
  { id: 1, name: "北欧极简台灯", price: 299, originalPrice: 599, rating: 4.8, sold: "2.3k", color: "#E8D5B7", emoji: "\u{1F4A1}", tag: "热卖" },
  { id: 2, name: "手工陶瓷马克杯", price: 89, originalPrice: 129, rating: 4.9, sold: "5.1k", color: "#D4E6F1", emoji: "\u2615", tag: null },
  { id: 3, name: "日式棉麻围裙", price: 159, originalPrice: 239, rating: 4.7, sold: "890", color: "#D5F5E3", emoji: "\u{1F457}", tag: "新品" },
  { id: 4, name: "黑胡桃木收纳盒", price: 199, originalPrice: 359, rating: 4.6, sold: "1.2k", color: "#F5E6CC", emoji: "\u{1F4E6}", tag: null },
  { id: 5, name: "无印良品香薰机", price: 349, originalPrice: 499, rating: 4.8, sold: "3.4k", color: "#FDEBD0", emoji: "\u{1F56F}\uFE0F", tag: "限时" },
  { id: 6, name: "复古蓝牙音箱", price: 459, originalPrice: 699, rating: 4.5, sold: "670", color: "#E8DAEF", emoji: "\u{1F50A}", tag: null },
];

const initCart = [
  { ...products[0], qty: 1, selected: true },
  { ...products[2], qty: 2, selected: true },
  { ...products[4], qty: 1, selected: false },
];

/* ─── StatusBar ─── */
function StatusBar() {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 20px", fontSize: 12, fontWeight: 600, color: C.onSurface }}>
      <span>9:41</span>
      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
        <div style={{ width: 16, height: 10, borderRadius: 2, border: "1.5px solid " + C.onSurface, position: "relative" }}>
          <div style={{ position: "absolute", left: 1, top: 1, bottom: 1, width: "70%", background: C.onSurface, borderRadius: 1 }} />
        </div>
      </div>
    </div>
  );
}

/* ─── BottomNav ─── */
function BottomNav({ active, onChange }) {
  const tabs = [
    { key: "home", Icon: IconHome, label: "首页" },
    { key: "category", Icon: IconGrid, label: "分类" },
    { key: "message", Icon: IconMessage, label: "消息" },
    { key: "cart", Icon: IconCart, label: "购物车" },
    { key: "me", Icon: IconUser, label: "我的" },
  ];
  return (
    <div style={{ display: "flex", borderTop: "1px solid " + C.outline, background: C.surface, padding: "6px 0 8px" }}>
      {tabs.map(t => {
        const on = active === t.key;
        return (
          <button key={t.key} onClick={() => onChange(t.key)} style={{
            flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
            background: "none", border: "none", cursor: "pointer", padding: "4px 0",
            color: on ? C.accent : C.onSurfaceVariant, transition: "color 0.2s"
          }}>
            <t.Icon size={22} strokeWidth={on ? 2.2 : 1.5} />
            <span style={{ fontSize: 11, fontWeight: on ? 600 : 400 }}>{t.label}</span>
            {on && <div style={{ width: 4, height: 4, borderRadius: "50%", background: C.accent, marginTop: 1 }} />}
          </button>
        );
      })}
    </div>
  );
}

/* ─── ProductCard ─── */
function ProductCard({ product, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: C.surface, borderRadius: 12, overflow: "hidden", cursor: "pointer",
      boxShadow: "0 1px 4px rgba(0,0,0,0.06)", transition: "transform 0.2s, box-shadow 0.2s",
    }}
      onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 4px 12px rgba(0,0,0,0.1)"; }}
      onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 1px 4px rgba(0,0,0,0.06)"; }}
    >
      <div style={{ position: "relative", paddingTop: "100%", background: product.color }}>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 48 }}>{product.emoji}</div>
        {product.tag && (
          <div style={{ position: "absolute", top: 8, left: 0, background: C.accent, color: "#fff", fontSize: 10, fontWeight: 600, padding: "2px 8px 2px 6px", borderRadius: "0 10px 10px 0" }}>{product.tag}</div>
        )}
        <button style={{ position: "absolute", top: 8, right: 8, width: 28, height: 28, borderRadius: "50%", background: "rgba(255,255,255,0.85)", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <IconHeart size={14} strokeWidth={1.5} color={C.onSurfaceVariant} />
        </button>
      </div>
      <div style={{ padding: "10px 10px 12px" }}>
        <div style={{ fontSize: 14, fontWeight: 500, color: C.onSurface, lineHeight: "20px", height: 40, overflow: "hidden" }}>{product.name}</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginTop: 8 }}>
          <span style={{ fontSize: 18, fontWeight: 700, color: C.accent }}>¥{product.price}</span>
          <span style={{ fontSize: 12, color: C.onSurfaceVariant, textDecoration: "line-through" }}>¥{product.originalPrice}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 4, marginTop: 4, fontSize: 11, color: C.onSurfaceVariant }}>
          <IconStar size={10} /> {product.rating} · 已售{product.sold}
        </div>
      </div>
    </div>
  );
}

/* ─── HomeScreen ─── */
function HomeScreen({ onProductClick }) {
  const [activeCategory, setActiveCategory] = useState(0);
  const [bannerIndex, setBannerIndex] = useState(0);
  const [searchFocused, setSearchFocused] = useState(false);

  return (
    <div style={{ flex: 1, overflow: "auto", background: C.surfaceVariant }}>
      <div style={{ padding: "8px 16px 12px", background: C.surface, position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{
          display: "flex", alignItems: "center", gap: 8, height: 40, borderRadius: 20,
          background: C.surfaceVariant, padding: "0 14px",
          border: searchFocused ? "1.5px solid " + C.primary : "1.5px solid transparent", transition: "border 0.2s"
        }}>
          <IconSearch size={18} color={C.onSurfaceVariant} strokeWidth={1.8} />
          <input placeholder="搜索商品、品牌、品类..." onFocus={() => setSearchFocused(true)} onBlur={() => setSearchFocused(false)}
            style={{ flex: 1, border: "none", background: "none", outline: "none", fontSize: 14, color: C.onSurface, fontFamily: "inherit" }} />
          <IconCamera size={18} color={C.onSurfaceVariant} strokeWidth={1.5} style={{ cursor: "pointer" }} />
        </div>
      </div>

      <div style={{ padding: "12px 16px 0" }}>
        <div style={{ height: 160, borderRadius: 12, background: banners[bannerIndex].bg, display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 28px", position: "relative", overflow: "hidden", transition: "background 0.5s" }}>
          <div style={{ fontSize: 26, fontWeight: 700, color: "#fff", letterSpacing: 1 }}>{banners[bannerIndex].title}</div>
          <div style={{ fontSize: 14, color: "rgba(255,255,255,0.85)", marginTop: 6 }}>{banners[bannerIndex].subtitle}</div>
          <button style={{ marginTop: 14, alignSelf: "flex-start", padding: "6px 18px", borderRadius: 16, background: "rgba(255,255,255,0.25)", border: "1px solid rgba(255,255,255,0.4)", color: "#fff", fontSize: 12, fontWeight: 500, cursor: "pointer" }}>立即查看 →</button>
          <div style={{ position: "absolute", bottom: 12, right: 20, display: "flex", gap: 6 }}>
            {banners.map((_, i) => (
              <button key={i} onClick={() => setBannerIndex(i)} style={{
                width: bannerIndex === i ? 18 : 6, height: 6, borderRadius: 3, border: "none", cursor: "pointer",
                background: bannerIndex === i ? "#fff" : "rgba(255,255,255,0.4)", transition: "all 0.3s"
              }} />
            ))}
          </div>
        </div>
      </div>

      <div style={{ padding: "16px 0 4px" }}>
        <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "0 16px" }}>
          {categories.map((cat, i) => (
            <button key={cat} onClick={() => setActiveCategory(i)} style={{
              padding: "6px 16px", borderRadius: 16, border: "none", cursor: "pointer",
              fontSize: 13, fontWeight: activeCategory === i ? 600 : 400, whiteSpace: "nowrap",
              background: activeCategory === i ? C.primaryContainer : C.surface,
              color: activeCategory === i ? C.primary : C.onSurfaceVariant, transition: "all 0.2s"
            }}>{cat}</button>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 16px 10px" }}>
        <span style={{ fontSize: 18, fontWeight: 600, color: C.onSurface }}>为你推荐</span>
        <span style={{ fontSize: 12, color: C.onSurfaceVariant, cursor: "pointer", display: "flex", alignItems: "center", gap: 2 }}>
          更多 <IconArrowRight size={14} />
        </span>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, padding: "0 16px 20px" }}>
        {products.map(p => <ProductCard key={p.id} product={p} onClick={() => onProductClick(p)} />)}
      </div>
    </div>
  );
}

/* ─── DetailScreen ─── */
function DetailScreen({ product, onBack, onAddCart }) {
  const [selectedSpec, setSelectedSpec] = useState(0);
  const specs = ["默认款", "升级款", "限定款"];

  return (
    <div style={{ flex: 1, overflow: "auto", background: C.surfaceVariant }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 16px", background: C.surface, position: "sticky", top: 0, zIndex: 10 }}>
        <button onClick={onBack} style={{ width: 36, height: 36, borderRadius: "50%", background: C.surfaceVariant, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <IconChevronLeft size={20} color={C.onSurface} />
        </button>
        <div style={{ display: "flex", gap: 10 }}>
          <button style={{ width: 36, height: 36, borderRadius: "50%", background: C.surfaceVariant, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <IconShare size={18} color={C.onSurface} strokeWidth={1.5} />
          </button>
          <button style={{ width: 36, height: 36, borderRadius: "50%", background: C.surfaceVariant, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <IconHeart size={18} color={C.accent} strokeWidth={1.5} />
          </button>
        </div>
      </div>

      <div style={{ height: 320, background: product.color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 80 }}>{product.emoji}</div>

      <div style={{ background: C.surface, padding: 16, marginTop: -1 }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <span style={{ fontSize: 28, fontWeight: 700, color: C.accent }}>¥{product.price}</span>
          <span style={{ fontSize: 15, color: C.onSurfaceVariant, textDecoration: "line-through" }}>¥{product.originalPrice}</span>
          <span style={{ marginLeft: "auto", fontSize: 11, fontWeight: 600, color: C.accent, background: C.accentLight, padding: "2px 8px", borderRadius: 4 }}>省¥{product.originalPrice - product.price}</span>
        </div>
        <div style={{ fontSize: 17, fontWeight: 600, color: C.onSurface, lineHeight: "24px", marginTop: 10 }}>{product.name}</div>
        <div style={{ display: "flex", gap: 16, marginTop: 10, fontSize: 13, color: C.onSurfaceVariant }}>
          <span style={{ display: "flex", alignItems: "center", gap: 3 }}><IconStar size={13} /> {product.rating}</span>
          <span>已售 {product.sold}</span>
          <span>{Math.round((1 - product.price / product.originalPrice) * 100)}% OFF</span>
        </div>
      </div>

      <div style={{ background: C.surface, padding: "14px 16px", marginTop: 8 }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: C.onSurface, marginBottom: 10 }}>选择规格</div>
        <div style={{ display: "flex", gap: 8 }}>
          {specs.map((s, i) => (
            <button key={s} onClick={() => setSelectedSpec(i)} style={{
              padding: "6px 16px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 500,
              border: selectedSpec === i ? "1.5px solid " + C.accent : "1px solid " + C.outline,
              background: selectedSpec === i ? C.accentLight : C.surface,
              color: selectedSpec === i ? C.accent : C.onSurface, transition: "all 0.2s"
            }}>{s}</button>
          ))}
        </div>
      </div>

      <div style={{ background: C.surface, padding: "14px 16px", marginTop: 8, display: "flex", gap: 20, justifyContent: "center" }}>
        {[{ Icon: IconTruck, text: "免费配送" }, { Icon: IconShield, text: "正品保障" }, { Icon: IconClock, text: "7天退换" }].map(item => (
          <div key={item.text} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: C.onSurfaceVariant }}>
            <item.Icon size={14} strokeWidth={1.5} /> {item.text}
          </div>
        ))}
      </div>

      <div style={{ background: C.surface, padding: 16, marginTop: 8 }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: C.onSurface, marginBottom: 10 }}>商品详情</div>
        <div style={{ fontSize: 13, color: C.onSurfaceVariant, lineHeight: "20px" }}>
          精选优质材料，匠心打造每一个细节。简约而不简单的设计语言，让日常生活多一份品质感。产品通过严格品控，为您提供舒适的使用体验。无论自用还是送礼，都是上佳之选。
        </div>
      </div>

      <div style={{ height: 80 }} />

      <div style={{ position: "sticky", bottom: 0, background: C.surface, padding: "10px 16px", borderTop: "1px solid " + C.outline, display: "flex", gap: 10, alignItems: "center" }}>
        <button style={{ width: 44, height: 44, borderRadius: "50%", background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <IconMessage size={18} color={C.onSurfaceVariant} strokeWidth={1.5} />
          <span style={{ fontSize: 9, color: C.onSurfaceVariant }}>客服</span>
        </button>
        <button onClick={onAddCart} style={{ flex: 1, height: 44, borderRadius: 22, border: "1.5px solid " + C.accent, background: "none", color: C.accent, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>加入购物车</button>
        <button onClick={onAddCart} style={{ flex: 1, height: 44, borderRadius: 22, border: "none", background: C.accent, color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>立即购买</button>
      </div>
    </div>
  );
}

/* ─── CartScreen ─── */
function CartScreen() {
  const [items, setItems] = useState(initCart);
  const updateQty = (id, d) => setItems(items.map(it => it.id === id ? { ...it, qty: Math.max(1, it.qty + d) } : it));
  const toggleSelect = (id) => setItems(items.map(it => it.id === id ? { ...it, selected: !it.selected } : it));
  const toggleAll = () => { const a = items.every(it => it.selected); setItems(items.map(it => ({ ...it, selected: !a }))); };
  const totalPrice = items.filter(it => it.selected).reduce((s, it) => s + it.price * it.qty, 0);
  const selectedCount = items.filter(it => it.selected).length;

  return (
    <div style={{ flex: 1, overflow: "auto", background: C.surfaceVariant }}>
      <div style={{ padding: "12px 16px", background: C.surface, borderBottom: "1px solid " + C.outline }}>
        <span style={{ fontSize: 18, fontWeight: 600, color: C.onSurface }}>购物车 ({items.length})</span>
      </div>

      <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
        {items.map(item => (
          <div key={item.id} style={{ display: "flex", gap: 12, background: C.surface, borderRadius: 12, padding: 12, boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
            <button onClick={() => toggleSelect(item.id)} style={{
              width: 22, height: 22, borderRadius: "50%",
              border: item.selected ? "none" : "2px solid " + C.outline,
              background: item.selected ? C.accent : "none", cursor: "pointer", marginTop: 14,
              display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "all 0.2s"
            }}>
              {item.selected && <span style={{ color: "#fff", fontSize: 12, fontWeight: 700 }}>✓</span>}
            </button>

            <div style={{ width: 88, height: 88, borderRadius: 8, background: item.color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 36, flexShrink: 0 }}>{item.emoji}</div>

            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 500, color: C.onSurface, lineHeight: "20px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.name}</div>
              <div style={{ fontSize: 11, color: C.onSurfaceVariant, marginTop: 2 }}>默认款</div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12 }}>
                <span style={{ fontSize: 16, fontWeight: 700, color: C.accent }}>¥{item.price}</span>
                <div style={{ display: "flex", alignItems: "center" }}>
                  <button onClick={() => updateQty(item.id, -1)} style={{ width: 28, height: 28, borderRadius: "50%", border: "1px solid " + C.outline, background: C.surface, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <IconMinus size={14} color={C.onSurfaceVariant} />
                  </button>
                  <span style={{ width: 32, textAlign: "center", fontSize: 14, fontWeight: 600, color: C.onSurface }}>{item.qty}</span>
                  <button onClick={() => updateQty(item.id, 1)} style={{ width: 28, height: 28, borderRadius: "50%", border: "1px solid " + C.outline, background: C.surface, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <IconPlus size={14} color={C.onSurface} />
                  </button>
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ height: 80 }} />

      <div style={{ position: "sticky", bottom: 0, background: C.surface, padding: "10px 16px", borderTop: "1px solid " + C.outline, display: "flex", alignItems: "center", gap: 12 }}>
        <button onClick={toggleAll} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", cursor: "pointer" }}>
          <div style={{
            width: 20, height: 20, borderRadius: "50%",
            border: items.every(it => it.selected) ? "none" : "2px solid " + C.outline,
            background: items.every(it => it.selected) ? C.accent : "none",
            display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s"
          }}>
            {items.every(it => it.selected) && <span style={{ color: "#fff", fontSize: 11, fontWeight: 700 }}>✓</span>}
          </div>
          <span style={{ fontSize: 13, color: C.onSurface }}>全选</span>
        </button>
        <div style={{ flex: 1, textAlign: "right" }}>
          <span style={{ fontSize: 13, color: C.onSurfaceVariant }}>合计: </span>
          <span style={{ fontSize: 20, fontWeight: 700, color: C.accent }}>¥{totalPrice.toFixed(0)}</span>
        </div>
        <button style={{
          padding: "0 28px", height: 44, borderRadius: 22, border: "none",
          background: selectedCount > 0 ? C.accent : C.disabled,
          color: "#fff", fontSize: 14, fontWeight: 600, cursor: selectedCount > 0 ? "pointer" : "not-allowed"
        }}>结算 ({selectedCount})</button>
      </div>
    </div>
  );
}

/* ─── Main App ─── */
function JianWuApp() {
  const [screen, setScreen] = useState("home");
  const [detailProduct, setDetailProduct] = useState(null);

  const handleProductClick = (product) => { setDetailProduct(product); setScreen("detail"); };

  const renderScreen = () => {
    if (screen === "detail" && detailProduct) return <DetailScreen product={detailProduct} onBack={() => setScreen("home")} onAddCart={() => setScreen("cart")} />;
    switch (screen) {
      case "home": return <HomeScreen onProductClick={handleProductClick} />;
      case "category": return <CategoryScreen />;
      case "message": return <MessageScreen />;
      case "cart": return <CartScreen />;
      case "me": return <ProfileScreen />;
      default: return <HomeScreen onProductClick={handleProductClick} />;
    }
  };

  const activeTab = screen === "detail" ? "home" : screen;

  return (
    <div style={{ display: "flex", justifyContent: "center", alignItems: "center", minHeight: "100vh", background: "#E8E8F0", padding: 20 }}>
      {/* Phone Frame */}
      <div style={{
        width: 375, height: 812, background: C.surface, borderRadius: 40,
        boxShadow: "0 20px 60px rgba(0,0,0,0.15), 0 0 0 8px #1A1A2E",
        display: "flex", flexDirection: "column", overflow: "hidden", position: "relative"
      }}>
        <StatusBar />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          {renderScreen()}
        </div>
        {screen !== "detail" && <BottomNav active={activeTab} onChange={setScreen} />}
      </div>

      {/* Info Panel */}
      <div className="info-panel" style={{ marginLeft: 40, maxWidth: 280, padding: 24, background: "#fff", borderRadius: 16, boxShadow: "0 4px 20px rgba(0,0,0,0.08)" }}>
        <div style={{ fontSize: 20, fontWeight: 700, color: C.primary, marginBottom: 4 }}>简物 JianWu</div>
        <div style={{ fontSize: 12, color: C.onSurfaceVariant, marginBottom: 20 }}>极简电商 App UI 原型</div>

        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: C.onSurfaceVariant, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>色彩系统</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {[
              { c: C.primary, l: "主色" }, { c: C.accent, l: "强调" },
              { c: C.surfaceVariant, l: "底色" }, { c: C.onSurface, l: "文字" },
              { c: C.success, l: "成功" }
            ].map(s => (
              <div key={s.c} style={{ textAlign: "center" }}>
                <div style={{ width: 36, height: 36, borderRadius: 8, background: s.c, border: "1px solid " + C.outline }} />
                <div style={{ fontSize: 9, color: C.onSurfaceVariant, marginTop: 3 }}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: C.onSurfaceVariant, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>设计规范</div>
          <div style={{ fontSize: 12, color: C.onSurface, lineHeight: "18px" }}>
            <div>平台：Android / MD3</div>
            <div>字体：Noto Sans SC + Inter</div>
            <div>圆角：12dp 全局统一</div>
            <div>间距：4dp 基准网格</div>
          </div>
        </div>

        <div>
          <div style={{ fontSize: 11, fontWeight: 600, color: C.onSurfaceVariant, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>交互提示</div>
          <div style={{ fontSize: 12, color: C.onSurfaceVariant, lineHeight: "18px" }}>
            点击底部 Tab 切换页面<br />
            点击商品卡片查看详情<br />
            购物车支持全选/数量调节
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<JianWuApp />);
</script>
